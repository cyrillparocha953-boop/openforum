<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            padding: 2rem;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 1rem;
        }

        h1 {
            font-size: 2rem;
            color: #38bdf8;
            font-weight: 600;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: 1px solid rgba(74, 222, 128, 0.2);
        }

        .pulse {
            width: 8px;
            height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.2; }
        }

        /* Grid para sa mga Grupo */
        .groups-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .group-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }

        .group-card:hover {
            transform: translateY(-2px);
            border-color: #38bdf8;
        }

        .group-header {
            font-size: 1.2rem;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .group-badge {
            background: #38bdf8;
            color: #0f172a;
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-weight: bold;
        }

        .data-list {
            max-height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .data-item {
            background: rgba(15, 23, 42, 0.5);
            padding: 0.75rem;
            border-radius: 8px;
            border-left: 4px solid #38bdf8;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease;
        }

        .data-time {
            display: block;
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.25rem;
        }

        .empty-text {
            color: #64748b;
            font-style: italic;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 1rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header>
            <h1>Admin Monitoring Dashboard</h1>
            <div class="live-indicator">
                <div class="pulse"></div> Real-time Active
            </div>
        </header>

        <!-- Dito naka-grupo ang mga data -->
        <div class="groups-grid">
            <!-- Grupo A -->
            <div class="group-card">
                <div class="group-header">
                    <span>Grupo A</span>
                    <span class="group-badge" id="count-GrupoA">0</span>
                </div>
                <div class="data-list" id="list-GrupoA">
                    <p class="empty-text">Walang data...</p>
                </div>
            </div>

            <!-- Grupo B -->
            <div class="group-card">
                <div class="group-header">
                    <span>Grupo B</span>
                    <span class="group-badge" id="count-GrupoB">0</span>
                </div>
                <div class="data-list" id="list-GrupoB">
                    <p class="empty-text">Walang data...</p>
                </div>
            </div>

            <!-- Grupo C -->
            <div class="group-card">
                <div class="group-header">
                    <span>Grupo C</span>
                    <span class="group-badge" id="count-GrupoC">0</span>
                </div>
                <div class="data-list" id="list-GrupoC">
                    <p class="empty-text">Walang data...</p>
                </div>
            </div>

            <!-- Grupo D -->
            <div class="group-card">
                <div class="group-header">
                    <span>Grupo D</span>
                    <span class="group-badge" id="count-GrupoD">0</span>
                </div>
                <div class="data-list" id="list-GrupoD">
                    <p class="empty-text">Walang data...</p>
                </div>
            </div>
        </div>
    </div>

  <script>
    const counts = { "Grupo A": 0, "Grupo B": 0, "Grupo C": 0, "Grupo D": 0 };

    // Paraan 1: Pakikinig sa pagbabago mula sa kabilang tab (Standard Storage Event)
    window.addEventListener('storage', function(e) {
        if (e.key === 'admin_received_data' && e.newValue) {
            const data = JSON.parse(e.newValue);
            appendDataToAdmin(data.group, data.message, data.timestamp);
        }
    });

    // Paraan 2: Back-up Timer (Suriin bawat kalahating segundo kung ayaw gumana ng Event Listener sa browser mo)
    let lastCheckedId = null;
    setInterval(() => {
        const rawData = localStorage.getItem('admin_received_data');
        if (rawData) {
            const data = JSON.parse(rawData);
            if (data && data.id !== lastCheckedId) {
                lastCheckedId = data.id;
                appendDataToAdmin(data.group, data.message, data.timestamp);
            }
        }
    }, 500);

    function appendDataToAdmin(group, message, timestamp) {
        // Alisin ang espasyo sa pangalan ng grupo para tugma sa ID (e.g., "Grupo A" -> "GrupoA")
        const cleanGroupId = group.replace(/\s+/g, '');
        const listContainer = document.getElementById(`list-${cleanGroupId}`);
        
        if (!listContainer) return;

        // Tanggalin ang "Walang data..." text kung nandiyan pa
        const emptyText = listContainer.querySelector('.empty-text');
        if (emptyText) {
            emptyText.remove();
        }

        // Gumawa ng bagong elemento para sa mensahe
        const dataItem = document.createElement('div');
        dataItem.className = 'data-item';
        dataItem.innerHTML = `
            <div>${message}</div>
            <span class="data-time">${timestamp}</span>
        `;

        // Ilagay sa pinakataas ng listahan
        listContainer.insertBefore(dataItem, listContainer.firstChild);

        // I-update ang counter badge
        if (counts.hasOwnProperty(group)) {
            counts[group]++;
            document.getElementById(`count-${cleanGroupId}`).innerText = counts[group];
        }
    }
</script>
