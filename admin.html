<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Word Cloud Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #090d16, #111827);
            color: #f8fafc;
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1100px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 1rem;
        }

        h1 {
            font-size: 1.8rem;
            color: #38bdf8;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            border: 1px solid rgba(74, 222, 128, 0.2);
        }

        .pulse {
            width: 8px;
            height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.2; }
        }

        /* Pangunahing Lalagyan ng Word Cloud Screen */
        .cloud-screen {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid #1e293b;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin-bottom: 1.5rem;
            text-align: center;
            position: relative;
        }

        .cloud-title {
            font-size: 1.4rem;
            color: #e2e8f0;
            margin-bottom: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Dito mismo iguguhit ang mga lumalaking pangalan */
        #word-cloud-canvas {
            width: 100%;
            height: 400px;
            border-radius: 8px;
            background: #0f172a; /* Dark background para lutang ang kulay */
        }

        /* Stats Counter sa Ibaba katulad ng sa sample photo */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 600;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #38bdf8;
        }

        .recent-list {
            list-style: none;
            font-size: 0.9rem;
            color: #cbd5e1;
            max-height: 80px;
            overflow-hidden: auto;
        }

        .recent-item {
            padding: 0.25rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header>
            <h1> Live Screen</h1>
            <div class="live-indicator">
                <div class="pulse"></div> active now
            </div>
        </header>

        <div class="cloud-screen">
            <div class="cloud-title">Mensahe ng mga Participants</div>
            <canvas id="word-cloud-canvas"></canvas>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Kabuuhang mga Pasalamat</span>
                <span class="stat-value" id="total-thanks">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Natatanging Pangalan</span>
                <span class="stat-value" id="unique-names">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Pinakabagong entry</span>
                <ul class="recent-list" id="recent-entries">
                    <li style="color:#64748b; font-style:italic;">Nag-aantay ng data...</li>
                </ul>
            </div>
        </div>
    </div>

<script>
    // 🔴 PALITAN ITO NG IYONG DETALYE MULA SA SUPABASE
    const SUPABASE_URL = "https://YOUR_PROJECT_ID.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_ANON_PUBLIC_KEY";

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    // Memory storage para sa mga natanggap na salita/mensahe
    let rawMessagesArray = [];

    // 1. KUNIN ANG DATA MULA SA SUPABASE SA UNANG PAGBUKAS NG PAGE
    async function initDashboard() {
        setupCanvas();
        
        const { data, error } = await supabase
            .from('messages')
            .select('message') // Tanging column ng text/pangalan ang kukunin
        
        if (error) {
            console.error("Error fetching data:", error);
            return;
        }

        if (data) {
            rawMessagesArray = data.map(item => item.message);
            updateDashboardVisuals();
        }
    }

    // 2. REAL-TIME LISTENER: Kapag may nag-send sa kabilang app, automatic sasakto rito
    supabase
        .channel('schema-db-changes')
        .on(
            'postgres_changes',
            { event: 'INSERT', schema: 'public', table: 'messages' },
            (payload) => {
                const newMessage = payload.new.message;
                rawMessagesArray.push(newMessage); // Idagdag ang bagong salita sa listahan
                
                // I-update ang "Pinakabagong Entry" section ticker
                addRecentTicker(newMessage);
                
                // I-refresh ang Word Cloud at Counter
                updateDashboardVisuals();
            }
        )
        .subscribe();

    // PROSESO AT PAG-UPDATE NG WORD CLOUD GRAPHICS
    function updateDashboardVisuals() {
        // I-update ang Total Pasalamat Counter
        document.getElementById('total-thanks').innerText = rawMessagesArray.length;

        // Bilangin kung ilang beses naulit ang bawat pangalan/salita
        const wordCounts = {};
        rawMessagesArray.forEach(msg => {
            // Linisin ang string (i-trim ang excess spaces)
            const cleanedWord = msg.trim();
            if (cleanedWord) {
                wordCounts[cleanedWord] = (wordCounts[cleanedWord] || 0) + 1;
            }
        });

        // I-update kung ilang natatanging pangalan ang mayroon
        const uniqueCount = Object.keys(wordCounts).length;
        document.getElementById('unique-names').innerText = uniqueCount;

        // I-convert sa format na kailangan ng WordCloud2.js: [ ['salita', dami], ['salita2', dami] ]
        const cloudData = Object.entries(wordCounts);

        // Kulay ng mga salita (mga neon shades para hawig sa picture)
        const neonColors = ['#38bdf8', '#f43f5e', '#34d399', '#fbbf24', '#a78bfa', '#f472b6', '#e2e8f0'];

        // Patakbuhin ang WordCloud engine sa Canvas natin
        WordCloud(document.getElementById('word-cloud-canvas'), {
            list: cloudData,
            gridSize: 8,
            weightFactor: function (size) {
                // Formula para sa laki ng font base sa dami ng sumend (Minimum 16px, lumalaki habang paulit-ulit)
                return Math.min(size * 14 + 12, 90); 
            },
            fontFamily: 'Segoe UI, Arial, sans-serif',
            color: function () {
                // Random na pipili ng kulay sa listahan ng neonColors
                return neonColors[Math.floor(Math.random() * neonColors.length)];
            },
            backgroundColor: '#0f172a',
            rotateRatio: 0.3, // 30% na tsansa na patayo/pahalang ang salita tulad ng sa screen mo
            rotationSteps: 2,
            minSize: 14,
            drawOutOfBound: false
        });
    }

    // Helper functions para sa canvas sizing at real-time list ticker
    function setupCanvas() {
        const canvas = document.getElementById('word-cloud-canvas');
        canvas.width = canvas.parentElement.offsetWidth - 40;
        canvas.height = 400;
    }

    function addRecentTicker(text) {
        const ticker = document.getElementById('recent-entries');
        if (ticker.querySelector('li') && ticker.querySelector('li').style.fontStyle === 'italic') {
            ticker.innerHTML = ''; // Tanggalin ang temporary loading indicator
        }
        const li = document.createElement('li');
        li.className = 'recent-item';
        li.innerText = `✨ ${text}`;
        ticker.insertBefore(li, ticker.firstChild);
        
        // Panatilihing top 3 entries lang ang nakikita sa listahan
        if (ticker.children.length > 3) {
            ticker.removeChild(ticker.lastChild);
        }
    }

    // Awtomatikong mag-re-resize ang word cloud kapag lumaki/lumitaw ang browser tab screen
    window.addEventListener('resize', () => {
        setupCanvas();
        updateDashboardVisuals();
    });

    // Simulan ang app
    window.onload = initDashboard;
</script>
</body>
</html>
